
name: CoSpace CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/cospace_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/cospace_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check ESLint
        run: npm run lint

      - name: Generate Next.js types
        run: npx next typegen

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 20

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: cospace-production
      cancel-in-progress: false

    env:
      INSTANCE_ID: i-0c28e46d9aeb2cc27
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::549185354734:role/CoSpace-Deployment-Policy
          aws-region: us-east-2

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Deploy application via SSM
        shell: bash
        run: |
          PARAMETERS=$(jq -nc \
            --arg command "/opt/cospace/deploy.sh $IMAGE_TAG" \
            '{commands: [$command], executionTimeout: ["900"]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "CoSpace deployment $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 60 \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          echo "Deploying commit: $IMAGE_TAG"

          for attempt in $(seq 1 200); do
            if ! RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json); then

              sleep 5
              continue
            fi

            STATUS=$(echo "$RESULT" | jq -r '.Status')

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "$RESULT" | jq -r '.StandardOutputContent'
                echo "$RESULT" | jq -r '.StandardErrorContent'
                echo "Deployment completed successfully"
                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "$RESULT" | jq -r '.StandardOutputContent'
                echo "$RESULT" | jq -r '.StandardErrorContent'
                echo "::error::Deployment failed: $STATUS"
                exit 1
                ;;

              Pending|InProgress|Delayed|Cancelling)
                sleep 5
                ;;

              *)
                echo "::error::Unexpected SSM status: $STATUS"
                exit 1
                ;;
            esac
          done

          echo "::error::Deployment status polling timed out"
          exit 1
