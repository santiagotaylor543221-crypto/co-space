
name: CoSpace CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cospace_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - '127.0.0.1:54329:5432'
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci -d cospace_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:54329/cospace_ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:54329/cospace_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check ESLint
        run: npm run lint

      - name: Generate Next.js types
        run: npx next typegen

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Test workspace storage
        run: npm run test:workspaces

      - name: Apply migrations to test database
        run: npx --no-install prisma migrate deploy

      - name: Test authentication and PostgreSQL integration
        timeout-minutes: 8
        shell: bash
        env:
          AUTH_ORIGIN: http://127.0.0.1:3100
          AUTH_TEST_URL: http://127.0.0.1:3100
          AUTH_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_ACCESS_SECRET: ci-only-access-secret-for-cospace-tests
          JWT_REFRESH_SECRET: ci-only-refresh-secret-for-cospace-tests
        run: |
          SERVER_LOG="$RUNNER_TEMP/cospace-next.log"
          ./node_modules/.bin/next dev --hostname 127.0.0.1 --port 3100 > "$SERVER_LOG" 2>&1 &
          SERVER_PID=$!

          trap '
            status=$?
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            if (( status != 0 )); then
              cat "$SERVER_LOG"
            fi
          ' EXIT

          for _ in {1..30}; do
            if curl --fail --silent --max-time 5 --output /dev/null "$AUTH_TEST_URL/api/workspaces"; then
              npm run test:auth
              exit 0
            fi
            kill -0 "$SERVER_PID" 2>/dev/null || break
            sleep 2
          done

          echo "::error::Next.js did not become ready with the test database"
          exit 1

      - name: Build Next.js
        run: npm run build

  test-lambda:
    name: Test thumbnail Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lambda/image-thumbnails

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lambda/image-thumbnails/package-lock.json

      - name: Install Lambda dependencies
        run: npm ci

      - name: Test Lambda with mocked S3
        run: npm test

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: [validate, test-lambda]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 20

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: cospace-production
      cancel-in-progress: false

    env:
      INSTANCE_ID: i-0c28e46d9aeb2cc27
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::549185354734:role/CoSpace-Deployment-Policy
          aws-region: us-east-2

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Deploy application via SSM
        shell: bash
        run: |
          PARAMETERS=$(jq -nc \
            --arg command "/bin/bash /opt/cospace/deploy.sh $IMAGE_TAG" \
            '{commands: [$command], executionTimeout: ["900"]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "CoSpace deployment $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 60 \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          echo "Deploying commit: $IMAGE_TAG"

          for _ in $(seq 1 200); do
            if ! RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json); then

              sleep 5
              continue
            fi

            STATUS=$(echo "$RESULT" | jq -r '.Status')

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "$RESULT" | jq -r '.StandardOutputContent'
                echo "$RESULT" | jq -r '.StandardErrorContent'
                echo "Deployment completed successfully"
                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "$RESULT" | jq -r '.StandardOutputContent'
                echo "$RESULT" | jq -r '.StandardErrorContent'
                echo "::error::Deployment failed: $STATUS"
                exit 1
                ;;

              Pending|InProgress|Delayed|Cancelling)
                sleep 5
                ;;

              *)
                echo "::error::Unexpected SSM status: $STATUS"
                exit 1
                ;;
            esac
          done

          echo "::error::Deployment status polling timed out"
          exit 1
